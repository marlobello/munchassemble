name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build (TypeScript)
        working-directory: app
        run: npm run build

      - name: Lint (ESLint)
        working-directory: app
        run: npm run lint

      - name: Type-check tests
        working-directory: app
        run: npm run typecheck

      - name: Run tests
        working-directory: app
        run: npm test

      - name: Audit (no high or critical vulnerabilities)
        working-directory: app
        run: npm run audit

  bicep-lint:
    name: Bicep Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Bicep CLI
        run: az bicep install --version v0.48.1

      - name: Build Bicep (lint)
        run: az bicep build --file infra/main.bicep
