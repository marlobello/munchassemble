name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false
  queue: max

env:
  AZURE_RESOURCE_GROUP: rg-munchassemble-prod

permissions:
  id-token: write
  contents: read

jobs:
  bicep-what-if:
    name: What-If (PR preview)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Azure Login (OIDC)
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep CLI
        run: az bicep install --version v0.48.1

      - name: Bicep What-If
        run: |
          IMAGE=$(az containerapp list --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?name=='ca-munchassemble-prod'].properties.template.containers[0].image | [0]" -o tsv)
          WEB_IMAGE=$(az containerapp list --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?name=='ca-munchassemble-web-prod'].properties.template.containers[0].image | [0]" -o tsv)
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/env/prod.bicepparam \
            --parameters containerImage="${IMAGE:-mcr.microsoft.com/azuredocs/containerapps-helloworld:latest}" \
              webContainerImage="${WEB_IMAGE:-mcr.microsoft.com/azuredocs/containerapps-helloworld:latest}"

  deploy:
    name: Deploy Bicep
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: prod

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Azure Login (OIDC)
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "$AZURE_RESOURCE_GROUP" \
            --location centralus \
            --output none

      - name: Install Bicep CLI
        run: az bicep install --version v0.48.1

      - name: Preserve current container images
        id: current_image
        run: |
          IMAGE=$(az containerapp list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?name=='ca-munchassemble-prod'].properties.template.containers[0].image | [0]" \
            --output tsv)
          WEB_IMAGE=$(az containerapp list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?name=='ca-munchassemble-web-prod'].properties.template.containers[0].image | [0]" \
            --output tsv)
          # Fall back to placeholder only on very first deploy (app not yet deployed)
          if [ -z "$IMAGE" ]; then
            IMAGE="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          fi
          if [ -z "$WEB_IMAGE" ]; then
            WEB_IMAGE="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "web-image=$WEB_IMAGE" >> "$GITHUB_OUTPUT"
          echo "Using bot image: $IMAGE; web image: $WEB_IMAGE"

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/env/prod.bicepparam \
            --parameters containerImage="${{ steps.current_image.outputs.image }}" \
              webContainerImage="${{ steps.current_image.outputs.web-image }}" \
            --name "deploy-$(date +%Y%m%d-%H%M%S)"
